spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
app:
  cors:
    allowed-origin: ${CLIENT_ORIGIN}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}